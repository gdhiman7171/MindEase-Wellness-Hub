  <style>

      --primary-dark-sage: #385E4C;
      --forest-green: #274C38;
      --accent-purple: #8E7DBE;
      --dark-purple: #554473;

      --bg-card: #FFFFFF;
      --bg-parchment: #F4F1EA;
      --accent-coral: #E88E7D;
      --accent-yellow: #F6D55C;
      --whatsapp-green: #25D366;
      --text-dark: #22332B;
      --text-muted: #5A6E63;
      --border-light: rgba(91, 138, 114, 0.15);
      --shadow-soft: 0 10px 30px -5px rgba(45, 90, 67, 0.08);
      --shadow-hover: 0 20px 40px -10px rgba(45, 90, 67, 0.15);
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-family: var(--font-main); background-color: var(--bg-cream); color: var(--text-dark); }

    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); color: var(--forest-green); line-height: 1.25; }

    /* Welcome Overlay */
    .welcome-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10000;
      background: radial-gradient(circle at 50% 30%, rgba(234, 228, 242, 0.95) 0%, rgba(216, 236, 226, 0.95) 50%, rgba(250, 249, 245, 1) 100%), url('hero-bg.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .welcome-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      padding: 40px 24px;

      width: 100%;
      box-shadow: 0 20px 50px rgba(39, 76, 56, 0.15);
      animation: welcomePop 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes welcomePop {
      0% { opacity: 0; transform: scale(0.95) translateY(15px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
      will-change: transform;
      transform-style: preserve-3d;
    }
    .glass-card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* UNIQUE BACKGROUND IMAGES FOR EVERY SINGLE PAGE */
    .bg-page-home {
      background: linear-gradient(rgba(250, 249, 245, 0.85), rgba(250, 249, 245, 0.94)), url('hero-bg.jpg'), linear-gradient(135deg, #FAF9F5 0%, #EAE4F2 50%, #D8ECE2 100%);

      background-position: center;
    }

    .bg-page-offerings {
      background: linear-gradient(rgba(244, 241, 234, 0.88), rgba(250, 249, 245, 0.94)), url('workshop-bg.jpg'), linear-gradient(135deg, #FAF9F5 0%, #E2F1E8 50%, #FAF9F5 100%);

      background-position: center;
    }

    .bg-page-activities {
      background: linear-gradient(rgba(255, 245, 242, 0.88), rgba(250, 249, 245, 0.94)), url('slider-1.jpg'), linear-gradient(135deg, #FFF5F2 0%, #EAE4F2 50%, #FAF9F5 100%);
      background-size: cover;
      background-position: center;
    }

    .bg-page-experience {
      background: linear-gradient(rgba(240, 247, 244, 0.88), rgba(244, 241, 234, 0.94)), url('slider-2.jpg'), linear-gradient(135deg, #F0F7F4 0%, #EBF3F5 50%, #F4F1EA 100%);
      background-size: cover;
      background-position: center;
    }

    .bg-page-whoFor {

    .bg-page-collaborate {

    .bg-page-events {

    .sticky-note {

      background: #FFF9C4;

    .pill-badge {

    /* TRANSLUCENT SIDE ARROW BUTTONS */
    .side-nav-arrow {

    .side-nav-arrow:hover {
      background: #5B8A72;
      color: white;
      opacity: 1;
      transform: translateY(-50%) scale(1.15);
      box-shadow: 0 12px 30px rgba(39, 76, 56, 0.35);

    .side-nav-arrow.left-arrow { left: 16px; }

    .whatsapp-widget {

      bottom: 24px;

      z-index: 9999;

      flex-direction: column;
      align-items: flex-end;
    }

    .whatsapp-button {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: #25D366;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.45);
      cursor: pointer;

    }
    .whatsapp-button:hover {

    }

    .whatsapp-popup {

      bottom: 75px;

      width: 320px;
      background: white;
      border-radius: 20px;

      overflow: hidden;
      border: 1px solid rgba(37, 211, 102, 0.3);

    }

    @keyframes popupSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-page-btn {
      background: transparent;
      border: none;
      color: #385E4C;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .nav-page-btn:hover {
      background: rgba(91, 138, 114, 0.12);
      color: #274C38;
      transform: translateY(-1px);
    }
    .nav-page-btn.active-page {
      background: #5B8A72;
      color: white !important;
      box-shadow: 0 4px 14px rgba(91, 138, 114, 0.35);
    }

    /* --- CLEAN, SILKY SMOOTH FADE-SLIDE TRANSITION --- */
    .page-container {
      min-height: 85vh;
      animation: smoothFadeSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: opacity, transform;
    }

    @keyframes smoothFadeSlideIn {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 960px) {
      .desktop-nav { display: none !important; }
      .side-nav-arrow { width: 44px; height: 44px; font-size: 1.1rem; }
      .side-nav-arrow.left-arrow { left: 8px; }
      .side-nav-arrow.right-arrow { right: 8px; }

  </style>

<body>
  <div id="root"></div>

  <!-- Open Copyright Calming Peaceful Piano Meditation Background Audio (Continuous Infinite Loop) -->
  <audio id="bg-calm-audio" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=meditation-peaceful-piano-112269.mp3" type="audio/mpeg" />
  </audio>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const WHATSAPP_NUMBER = "917082728149";
    const SECRET_EMAIL_ENDPOINT = "https://formsubmit.co/ajax/gdhiman7171@gmail.com";

    const pageOrder = [
      { id: 'home', title: '🏠 Home' },
      { id: 'offerings', title: '🌿 What We Offer' },
      { id: 'activities', title: '🎈 Fun Activities' },
      { id: 'experience', title: '🧘 Sessions' },
      { id: 'whoFor', title: '👥 WHO IS IT FOR?' },
      { id: 'collaborate', title: '🤝 Partner' },
      { id: 'events', title: '📅 Events' }
    ];

    const sendEmailNotification = (formData) => {
      fetch(SECRET_EMAIL_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          _subject: "New Mind Ease Session Booking Inquiry! 🍃",
          ...formData
        })
      }).catch(err => console.log("Email notification processed."));
    };

    const getLogo = (e) => {
      if (!e.target.dataset.tried) {
        e.target.dataset.tried = "true";
        e.target.src = "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=300&q=80";
      } else {
        e.target.style.display = 'none';
        if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
      }
    };

    function TiltCard({ children, style = {}, className = "", onClick }) {
      const cardRef = useRef(null);
      const [transformStyle, setTransformStyle] = useState("perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -6;
        const rotateY = ((x - centerX) / centerX) * 6;
        setTransformStyle(`perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`);
      };

      const handleMouseLeave = () => {
        setTransformStyle("perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
      };

      return (
        <div
          ref={cardRef}
          onClick={onClick}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`glass-card ${className}`}
          style={{
            ...style,
            transform: transformStyle,
            transition: 'transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease',
            position: 'relative',
            overflow: 'hidden'
          }}
        >
          {children}
        </div>
      );
    }

    function MagneticButton({ children, onClick, className = "", style = {}, type = "button", disabled = false }) {
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={className}
          style={{ ...style, transition: 'all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)' }}
        >
          {children}
        </button>
      );
    }

    // --- WELCOME OVERLAY WITH PROMINENT LOGO ---
    function WelcomePage({ onEnterWebsite }) {
      return (
        <div className="welcome-overlay">
          <div className="welcome-card">
            <div style={{ marginBottom: '18px', display: 'flex', justifyContent: 'center' }}>
              <img
                src="logo.jpg"
                alt="Mind Ease Logo"
                onError={getLogo}
                style={{
                  width: '120px', height: '120px', borderRadius: '50%', objectFit: 'cover',
                  border: '5px solid #5B8A72', boxShadow: '0 12px 35px rgba(39, 76, 56, 0.3)'
                }}
              />
            </div>

            <h1 style={{ fontSize: 'clamp(2rem, 5vw, 2.8rem)', fontWeight: 800, color: '#274C38', marginBottom: '6px' }}>
              Mind Ease Wellness Hub
            </h1>

            <div style={{ fontFamily: 'var(--font-hand)', fontSize: '1.8rem', fontWeight: 700, color: '#8E7DBE', marginBottom: '16px' }}>
              Where Minds Connect and Grow 🍃
            </div>

            <p style={{ color: '#5A6E63', fontSize: '0.98rem', lineHeight: 1.5, marginBottom: '28px', maxWidth: '480px', margin: '0 auto 28px' }}>
              Welcome to your student-friendly mental wellness sanctuary. Explore interactive activities, live gratitude walls, expert workshops, and peer community support!
            </p>

            <MagneticButton onClick={onEnterWebsite} className="btn-primary" style={{ fontSize: '1.1rem', padding: '14px 36px' }}>
              ✨ Enter Wellness Hub Website →
            </MagneticButton>
          </div>
        </div>
      );
    }

    // --- PULL RIBBON FOR LUCKY DRAW (ICON ONLY DEFAULT -> REVEALS REGISTER LABEL WHEN PULLED) ---
    function PullRibbon({ onRegisterLuckyGift }) {
      const [dragDistance, setDragDistance] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const startYRef = useRef(0);

      const handleMouseDown = (e) => {
        setIsDragging(true);
        startYRef.current = e.clientY || (e.touches && e.touches[0].clientY) || 0;
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const currentY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
          const deltaY = currentY - startYRef.current;
          if (deltaY > 0) {
            const newDist = Math.min(deltaY, 140);
            setDragDistance(newDist);
          }
        };

        const handleMouseUp = () => {
          if (!isDragging) return;
          setIsDragging(false);

          if (dragDistance >= 50) {
            if (window.confetti) window.confetti({ particleCount: 100, spread: 80 });
            onRegisterLuckyGift('🎁 Mind Ease Lucky Draw Registration');
          }
          setDragDistance(0);
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        window.addEventListener('touchmove', handleMouseMove);
        window.addEventListener('touchend', handleMouseUp);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
          window.removeEventListener('touchmove', handleMouseMove);
          window.removeEventListener('touchend', handleMouseUp);
        };
      }, [isDragging, dragDistance, onRegisterLuckyGift]);

      const isPulled = dragDistance > 25;

      return (
        <div style={{
          position: 'fixed', top: 0, left: '18px', zIndex: 9998,
          display: 'flex', flexDirection: 'column', alignItems: 'center', userSelect: 'none', touchAction: 'none'
        }}>
          <div
            onMouseDown={handleMouseDown}
            onTouchStart={handleMouseDown}
            onClick={() => {
              if (window.confetti) window.confetti({ particleCount: 80, spread: 70 });
              onRegisterLuckyGift('🎁 Mind Ease Lucky Draw Registration');
              setDragDistance(0);
            }}
            style={{
              width: isPulled ? '56px' : '44px',
              height: `${68 + dragDistance}px`,
              background: 'linear-gradient(180deg, #FFD700 0%, #FFA500 70%, #E88E7D 100%)',
              borderRadius: '0 0 20px 20px',
              boxShadow: '0 8px 25px rgba(255, 165, 0, 0.45)',
              cursor: 'grab',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'space-between',
              padding: '10px 4px', color: 'white',
              transition: isDragging ? 'width 0.2s ease' : 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
            }}
            title="Pull down or click to Register for Lucky Draw! 🎁"
          >
            {/* ICON ONLY DEFAULT */}
            <div style={{ fontSize: isPulled ? '1.4rem' : '1.3rem' }}>🎁</div>

            {/* REVEAL 'REGISTER FOR LUCKY DRAW' LABEL ONLY WHEN PULLED DOWN */}

    // --- REAL INTERACTIVE SPINNING WHEEL ---
    function SpinningWheel({ onBookSession }) {
      const [rotation, setRotation] = useState(0);
      const [spinning, setSpinning] = useState(false);
      const [winningResult, setWinningResult] = useState(null);

      const segments = [
        { label: "5 Deep Breaths 🌬️", color: "#5B8A72" },
        { label: "Drink Water 💧", color: "#8E7DBE" },
        { label: "Compliment Friend 💬", color: "#E88E7D" },
        { label: "Screen Detox 📱", color: "#385E4C" },
        { label: "3 Gratitudes 📝", color: "#F6D55C" },
        { label: "Listen to Song 🎵", color: "#554473" }
      ];

      const spin = () => {
        if (spinning) return;
        setSpinning(true);
        setWinningResult(null);

        const extraRotations = 5 + Math.floor(Math.random() * 5);
        const randomDegree = Math.floor(Math.random() * 360);
        const totalNewRotation = rotation + extraRotations * 360 + randomDegree;

        setRotation(totalNewRotation);

        setTimeout(() => {
          setSpinning(false);
          const finalAngle = (totalNewRotation % 360);
          const segmentAngle = 360 / segments.length;
          const selectedIdx = Math.floor((360 - (finalAngle % 360)) / segmentAngle) % segments.length;
          const result = segments[selectedIdx].label;
          setWinningResult(result);
          if (window.confetti) window.confetti({ particleCount: 80, spread: 70 });
        }, 3000);
      };

      return (
        <div style={{ textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
          <h3 style={{ fontSize: '1.5rem', color: '#274C38', marginBottom: '6px' }}>🎡 Wheel of Wellness</h3>
          <p style={{ color: '#5A6E63', marginBottom: '20px', fontSize: '0.9rem' }}>Spin the wheel for your daily micro-wellness challenge!</p>

          <div style={{ fontSize: '2rem', color: '#E88E7D', marginBottom: '-15px', zIndex: 10, filter: 'drop-shadow(0 2px 4px rgba(0,0,0,0.2))' }}>
            ▼
          </div>

          <div style={{ position: 'relative', width: '280px', height: '280px', margin: '0 auto 24px' }}>
            <svg
              viewBox="0 0 200 200"
              style={{
                width: '100%', height: '100%', borderRadius: '50%', boxShadow: '0 10px 30px rgba(0,0,0,0.18)',
                transform: `rotate(${rotation}deg)`, transition: spinning ? 'transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.02)' : 'none'
              }}
            >
              {segments.map((seg, i) => {
                const angle = 360 / segments.length;
                const startAngle = i * angle;
                const endAngle = (i + 1) * angle;
                const x1 = 100 + 100 * Math.cos((Math.PI * (startAngle - 90)) / 180);
                const y1 = 100 + 100 * Math.sin((Math.PI * (startAngle - 90)) / 180);
                const x2 = 100 + 100 * Math.cos((Math.PI * (endAngle - 90)) / 180);
                const y2 = 100 + 100 * Math.sin((Math.PI * (endAngle - 90)) / 180);
                const textAngle = startAngle + angle / 2;
                const textX = 100 + 65 * Math.cos((Math.PI * (textAngle - 90)) / 180);
                const textY = 100 + 65 * Math.sin((Math.PI * (textAngle - 90)) / 180);

                return (
                  <g key={i}>
                    <path d={`M100,100 L${x1},${y1} A100,100 0 0,1 ${x2},${y2} Z`} fill={seg.color} stroke="white" strokeWidth="2" />
                    <text x={textX} y={textY} fill="white" fontSize="9" fontWeight="800" textAnchor="middle" dominantBaseline="middle" transform={`rotate(${textAngle}, ${textX}, ${textY})`}>
                      {seg.label.split(' ')[0]}
                    </text>
                  </g>
                );
              })}
              <circle cx="100" cy="100" r="22" fill="white" stroke="#385E4C" strokeWidth="3" />
              <text x="100" y="100" textAnchor="middle" dominantBaseline="middle" fontSize="12">🍃</text>
            </svg>
          </div>

          <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', justifyContent: 'center' }}>
            <MagneticButton onClick={spin} disabled={spinning} className="btn-primary" style={{ padding: '12px 28px', fontSize: '0.95rem' }}>
              {spinning ? "🎡 Spinning..." : "✨ SPIN THE WHEEL! ✨"}
            </MagneticButton>
            <MagneticButton onClick={() => onBookSession('Wellness Wheel Challenge Session')} className="btn-secondary" style={{ padding: '12px 24px', fontSize: '0.95rem' }}>
              📅 Book Wellness Challenge Session →
            </MagneticButton>
          </div>

          {winningResult && (
            <div style={{ marginTop: '20px', padding: '16px 24px', borderRadius: '16px', backgroundColor: '#FAF9F5', border: '2px solid #5B8A72', fontSize: '1.15rem', fontWeight: 800, color: '#274C38', animation: 'welcomePop 0.4s ease-out' }}>
              🎉 Your Wellness Challenge: {winningResult}
            </div>
          )}
        </div>
      );
    }

              <div onClick={onShowWelcome} style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '8px', cursor: 'pointer' }}>
                <img src="logo.jpg" alt="Mind Ease" onError={getLogo} style={{ width: '36px', height: '36px', borderRadius: '50%' }} />
                <span style={{ fontSize: '1.3rem', fontWeight: 800, color: '#FFFFFF' }}>Mind Ease</span>
              </div>
              <p style={{ color: '#A3B8AC', fontSize: '0.85rem' }}>Where Minds Connect and Grow 🍃</p>
            </div>
            <div>
              <h4 style={{ color: '#FFFFFF', marginBottom: '10px' }}>PAGE NAVIGATION</h4>
              <p style={{ color: '#A3B8AC', fontSize: '0.825rem', lineHeight: 1.8 }}>
                <a href="#" onClick={(e)=>{e.preventDefault(); onNavigatePage('offerings');}} style={{ color: '#A3B8AC', textDecoration: 'none' }}>What We Offer Page</a><br/>
                <a href="#" onClick={(e)=>{e.preventDefault(); onNavigatePage('activities');}} style={{ color: '#A3B8AC', textDecoration: 'none' }}>Fun Activities Page</a><br/>
                <a href="#" onClick={(e)=>{e.preventDefault(); onNavigatePage('collaborate');}} style={{ color: '#A3B8AC', textDecoration: 'none' }}>Collaborations Page</a>
              </p>
            </div>
            <div>
              <h4 style={{ color: '#FFFFFF', marginBottom: '10px' }}>CONTACT SUPPORT</h4>
              <p style={{ color: '#A3B8AC', fontSize: '0.825rem' }}>
                💬 <strong>Direct WhatsApp Chat Support</strong><br/>
                ✉️ Instant Support Online
              </p>
            </div>
          </div>

          <div style={{ backgroundColor: '#554473', padding: '16px 20px', textAlign: 'center' }}>
            <div style={{ fontSize: '1.05rem', fontWeight: 800, color: '#FFFFFF', letterSpacing: '0.5px' }}>
              HEALTHY MIND. &nbsp;|&nbsp; HAPPY LIFE. &nbsp;|&nbsp; STRONGER TOGETHER.
            </div>
          </div>
        </footer>
      );
    }

    const labelStyle = { display: 'block', fontSize: '0.825rem', fontWeight: 700, color: '#274C38', marginBottom: '4px' };
    const inputStyle = { width: '100%', padding: '10px 14px', borderRadius: '12px', border: '1.5px solid rgba(91, 138, 114, 0.3)', fontSize: '0.9rem' };

    // --- MAIN APP WITH RELAXING GUITAR MUSIC & CLEAN MUTE/UNMUTE BUTTON ---
    function App() {
      const [showWelcome, setShowWelcome] = useState(true);
      const [currentPage, setCurrentPage] = useState('home');
      const [isMusicPlaying, setIsMusicPlaying] = useState(false);
      const [modal, setModal] = useState(false);
      const [sessionName, setSessionName] = useState(null);

      const currentIdx = pageOrder.findIndex(p => p.id === currentPage);
      const prevPage = pageOrder[(currentIdx - 1 + pageOrder.length) % pageOrder.length];
      const nextPage = pageOrder[(currentIdx + 1) % pageOrder.length];

      const handleNavigatePage = (targetPageId) => {
        if (targetPageId === currentPage) return;
        setCurrentPage(targetPageId);
        window.scrollTo(0, 0);
      };

      // CALM GUITAR MUSIC MUTE / UNMUTE TOGGLE WITH INFINITE LOOP RESTART
      const handleToggleMusic = () => {
        const audioEl = document.getElementById('bg-calm-audio');
        if (!audioEl) return;

        if (isMusicPlaying) {
          audioEl.pause();
          setIsMusicPlaying(false);
        } else {
          audioEl.volume = 0.45;
          audioEl.loop = true;
          audioEl.play().then(() => {
            setIsMusicPlaying(true);
          }).catch(err => {
            console.log("Audio play initiated.");
          });
        }
      };

      // Ensure audio loops infinitely if ended event fires
      useEffect(() => {
        const audioEl = document.getElementById('bg-calm-audio');
        if (!audioEl) return;
        const handleAudioEnded = () => {
          audioEl.currentTime = 0;
          audioEl.play().catch(() => {});
        };
        audioEl.addEventListener('ended', handleAudioEnded);
        return () => audioEl.removeEventListener('ended', handleAudioEnded);
      }, []);

      // KEYBOARD ARROW NAVIGATION ONLY (◀ ArrowLeft & ArrowRight ▶)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (showWelcome || modal) return;
          const targetTag = document.activeElement ? document.activeElement.tagName.toUpperCase() : '';
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(targetTag)) return;

          if (e.key === 'ArrowRight') {
            e.preventDefault();
            handleNavigatePage(nextPage.id);
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            handleNavigatePage(prevPage.id);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentPage, showWelcome, modal, nextPage.id, prevPage.id]);

      const openBooking = (name) => {
        setSessionName(name || 'Mindfulness & Stress Management');
        setModal(true);
      };

      return (
        <div>
          {showWelcome && <WelcomePage onEnterWebsite={() => {
            setShowWelcome(false);
            const audioEl = document.getElementById('bg-calm-audio');
            if (audioEl) {
              audioEl.volume = 0.45;
              audioEl.loop = true;
              audioEl.play().then(() => setIsMusicPlaying(true)).catch(() => {});
            }
          }} />}

          {/* FLOATING SIDE ARROW PAGE NAVIGATION */}
          <button
            onClick={() => handleNavigatePage(prevPage.id)}
            className="side-nav-arrow left-arrow"
            title={`Previous Page (◀ Arrow Key): ${prevPage.title}`}
          >
            ◀
          </button>
          <button
            onClick={() => handleNavigatePage(nextPage.id)}
            className="side-nav-arrow right-arrow"
            title={`Next Page (Arrow Key ▶): ${nextPage.title}`}
          >
            ▶
          </button>

          <Navbar
            currentPage={currentPage}
            onNavigatePage={handleNavigatePage}
            onOpenBooking={(name) => openBooking(name)}
            onShowWelcome={() => setShowWelcome(true)}
            isMusicPlaying={isMusicPlaying}
            onToggleMusic={handleToggleMusic}
          />

          {/* PAGE ROUTER VIEWS */}
          <div key={currentPage}>
            {currentPage === 'home' && <HomePage onNavigatePage={handleNavigatePage} onOpenBooking={(name) => openBooking(name)} />}
            {currentPage === 'offerings' && <OfferingsPage onBookSession={(name) => openBooking(name)} />}
            {currentPage === 'activities' && <ActivitiesPage onBookSession={(name) => openBooking(name)} />}
            {currentPage === 'experience' && <ExperiencePage onBookSession={(name) => openBooking(name)} />}
            {currentPage === 'whoFor' && <WhoForPage onBookSession={(name) => openBooking(name)} />}
            {currentPage === 'collaborate' && <CollaboratePage />}
            {currentPage === 'events' && (
              <EventsPage
                isModalOpen={modal}
                onCloseModal={(name) => { if (name) setSessionName(name); else setModal(false); }}
                selectedSessionName={sessionName}
              />
            )}
          </div>

          {/* GLOBAL BOOKING MODAL */}
          {modal && currentPage !== 'events' && (
            <div style={{
              position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
              backgroundColor: 'rgba(0,0,0,0.5)', backdropFilter: 'blur(6px)', zIndex: 9999,
              display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px'
            }}>
              <div className="glass-card" style={{
                backgroundColor: 'white', maxWidth: '440px', width: '100%', padding: '28px', borderRadius: '20px', position: 'relative'
              }}>
                <button onClick={() => setModal(false)} style={{ position: 'absolute', top: '14px', right: '14px', background: 'none', border: 'none', fontSize: '1.3rem', cursor: 'pointer' }}>✕</button>
                
                <h3 style={{ fontSize: '1.4rem', fontWeight: 800, color: '#274C38', marginBottom: '4px' }}>Book Your Session</h3>
                <p style={{ color: '#8E7DBE', fontWeight: 700, fontSize: '0.9rem', marginBottom: '18px' }}>{sessionName}</p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (window.confetti) window.confetti({ particleCount: 90 });
                  const name = e.target.client_name.value;
                  const phone = e.target.client_phone.value;
                  const date = e.target.client_date.value;

                  sendEmailNotification({
                    sessionTitle: sessionName,
                    clientName: name,
                    clientPhone: phone,
                    requestedDate: date
                  });

                  const waText = `Hi Mind Ease Wellness Hub! I would like to book a session for: "${sessionName}".\nName: ${name}\nPhone: ${phone}\nPreferred Date: ${date}`;
                  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`, '_blank');
                  setModal(false);
                }} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <div>
                    <label style={labelStyle}>Your Full Name</label>
                    <input type="text" name="client_name" placeholder="e.g. Rahul Sharma" style={inputStyle} required />
                  </div>
                  <div>
                    <label style={labelStyle}>WhatsApp Phone Number</label>
                    <input type="tel" name="client_phone" placeholder="Enter your mobile number" style={inputStyle} required />
                  </div>
                  <div>
                    <label style={labelStyle}>Preferred Session Date</label>
                    <input type="date" name="client_date" style={inputStyle} required />
                  </div>
                  <MagneticButton type="submit" className="btn-whatsapp" style={{ justifyContent: 'center', marginTop: '8px' }}>
                    💬 Confirm & Book via WhatsApp & Email
                  </MagneticButton>
                </form>
              </div>
            </div>
          )}

          <Footer onNavigatePage={handleNavigatePage} onShowWelcome={() => setShowWelcome(true)} />
          <WhatsAppChatWidget />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
